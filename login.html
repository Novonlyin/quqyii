<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>登录 - 人设生成器</title>
    <style>
        :root {
            --bg-color: #FAFAFA;
            --card-bg: #FFFFFF;
            --text-main: #111111;
            --text-muted: #8E8E93;
            --input-bg: #F2F2F7;
            --btn-bg: #111111;
            --border-color: #E5E5EA;
        }
        body {
            background-color: var(--bg-color); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh;
        }
        .auth-container {
            width: 90%; max-width: 360px; background: var(--card-bg);
            border-radius: 24px; padding: 32px 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
        }
        .logo-box { display: flex; justify-content: center; margin-bottom: 24px; }
        .logo-box svg { width: 48px; height: 48px; stroke-width: 1.5; color: var(--text-main); }
        .title { text-align: center; font-size: 22px; font-weight: 700; margin-bottom: 8px; margin-top: 0; }
        .subtitle { text-align: center; font-size: 14px; color: var(--text-muted); margin-bottom: 28px; }
        
        .tabs { display: flex; gap: 16px; margin-bottom: 24px; border-bottom: 1px solid var(--border-color); }
        .tab { flex: 1; text-align: center; padding-bottom: 12px; font-size: 15px; font-weight: 600; color: var(--text-muted); cursor: pointer; transition: 0.2s; }
        .tab.active { color: var(--text-main); border-bottom: 2px solid var(--text-main); }

        .input-group { margin-bottom: 16px; }
        .input-group input {
            width: 100%; box-sizing: border-box; background: var(--input-bg);
            border: 1px solid transparent; border-radius: 14px; padding: 16px;
            font-size: 15px; outline: none; transition: 0.2s; font-family: inherit; color: var(--text-main);
        }
        .input-group input:focus { background: #FFF; border: 1px solid var(--text-main); }
        
        .btn-submit {
            width: 100%; background: var(--btn-bg); color: #FFF; border: none;
            border-radius: 14px; padding: 16px; font-size: 16px; font-weight: 600;
            cursor: pointer; transition: 0.2s; margin-top: 8px; display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .btn-submit:active { opacity: 0.8; transform: scale(0.98); }
        .btn-submit svg { width: 18px; height: 18px; }
        
        #inviteGroup { display: none; }
        .error-msg { color: #FF3B30; font-size: 13px; text-align: center; margin-top: 12px; min-height: 18px; }
    </style>
    <!-- 引入刚刚建好的 auth.js -->
    <script src="auth.js"></script>
</head>
<body>

<div class="auth-container">
    <div class="logo-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
    </div>
    <h1 class="title" id="mainTitle">欢迎回来</h1>
    <div class="subtitle" id="subTitle">请输入账密以继续</div>

    <div class="tabs">
        <div class="tab active" id="tabLogin" onclick="switchMode('login')">登录</div>
        <div class="tab" id="tabRegister" onclick="switchMode('register')">注册</div>
    </div>

    <div class="input-group">
        <input type="text" id="username" placeholder="账号">
    </div>
    <div class="input-group">
        <input type="password" id="password" placeholder="密码">
    </div>
    <div class="input-group" id="inviteGroup">
        <input type="text" id="inviteCode" placeholder="一次性邀请码 (必填)">
    </div>

    <button class="btn-submit" onclick="submitAuth()">
        <span id="btnText">进入工具</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
    </button>
    <div class="error-msg" id="errorMsg"></div>
</div>

<script>
    let mode = 'login';

    function switchMode(newMode) {
        mode = newMode;
        document.getElementById('errorMsg').innerText = '';
        if (mode === 'login') {
            document.getElementById('tabLogin').classList.add('active');
            document.getElementById('tabRegister').classList.remove('active');
            document.getElementById('inviteGroup').style.display = 'none';
            document.getElementById('mainTitle').innerText = '欢迎回来';
            document.getElementById('subTitle').innerText = '请输入账密以继续';
            document.getElementById('btnText').innerText = '进入工具';
        } else {
            document.getElementById('tabRegister').classList.add('active');
            document.getElementById('tabLogin').classList.remove('active');
            document.getElementById('inviteGroup').style.display = 'block';
            document.getElementById('mainTitle').innerText = '创建账号';
            document.getElementById('subTitle').innerText = '需要有效的邀请码';
            document.getElementById('btnText').innerText = '注册并进入';
        }
    }

    async function submitAuth() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value.trim();
        const i = document.getElementById('inviteCode').value.trim();
        const errBox = document.getElementById('errorMsg');
        
        errBox.innerText = '处理中...';
        
        if (mode === 'login') {
            const res = handleLogin(u, p);
            if (res.success) window.location.href = 'index.html';
            else errBox.innerText = res.msg;
        } else {
            const res = await handleRegister(u, p, i);
            if (res.success) {
                // 注册成功自动登录
                handleLogin(u, p);
                window.location.href = 'index.html';
            } else {
                errBox.innerText = res.msg;
            }
        }
    }
</script>
</body>
</html>
